name: Contribution Snake

on:
  schedule:
    - cron: "37 3 * * *"   # daily, 03:37 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a shallow clone cannot rebase before pushing

      - name: Generate the snake animation from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit the animation when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh contribution snake"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            echo "push attempt $attempt failed (another workflow pushed first); retrying"
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
